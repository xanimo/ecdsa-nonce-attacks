name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The two stdlib scripts are cheap and deterministic. They gate every push.
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 nonce_reuse.py
      - run: python3 nonce_reuse_lows.py

  # hnp_bias needs fpylll/cysignals (heavy build) and minutes of BKZ. Manual only.
  lattice:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev libqd-dev
      - run: python3 -m pip install fpylll cysignals
      - run: python3 hnp_bias.py
